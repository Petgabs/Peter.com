name: Fetch Drive file

on:
  push:
    branches: [arena/01a0f31c-peter-com]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0f31c-peter-com

      - name: Download file from Google Drive
        run: |
          FILE_ID="1xe0rP5IRRPTJSJOhtUu_ek8Ma9QetGEZ"
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          touch schoolcloud-standalone.html
          for URL in \
            "https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download&confirm=t" \
            "https://drive.google.com/uc?export=download&id=${FILE_ID}&confirm=t"; do
            echo "=== Trying: $URL ==="
            curl -sSL --retry 3 -A "$UA" "$URL" -o schoolcloud-standalone.html || echo "curl failed for this URL"
            if head -c 1000 schoolcloud-standalone.html | grep -qi '<!doctype\|<html'; then
              echo "Looks like HTML, continuing."
              break
            fi
            echo "--- Response head (500 chars) ---"
            head -c 500 schoolcloud-standalone.html || true
            echo ""
          done

          echo "=== FILE INFO ==="
          ls -la schoolcloud-standalone.html
          echo "=== SHA256 ==="
          sha256sum schoolcloud-standalone.html || true
          echo "=== FIRST 300 CHARS ==="
          head -c 300 schoolcloud-standalone.html || true
          echo ""

          if head -c 1000 schoolcloud-standalone.html | grep -qi '<!doctype\|<html'; then
            echo "IS_HTML=yes" >> "$GITHUB_ENV"
          else
            echo "IS_HTML=no" >> "$GITHUB_ENV"
            echo "WARNING: downloaded content does not look like HTML"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: schoolcloud-standalone
          path: schoolcloud-standalone.html
          if-no-files-found: warn

      - name: Dump base64 to log (fallback)
        run: |
          echo "===BASE64_START==="
          base64 -w 0 schoolcloud-standalone.html || true
          echo ""
          echo "===BASE64_END==="

      - name: Commit downloaded file
        if: env.IS_HTML == 'yes'
        run: |
          git config user.name "arena-ai-coding-agent[bot]"
          git config user.email "arena-ai-coding-agent[bot]@users.noreply.github.com"
          git add schoolcloud-standalone.html
          git commit -m "Add SchoolCloud standalone HTML from Google Drive [skip ci]" || echo "nothing to commit"
          git push || echo "PUSH_FAILED - use artifact or log fallback"
